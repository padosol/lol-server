server:
  port: 8100
  tomcat:
    basedir: .
    accesslog:
      enabled: true
      pattern: "%{yyyy-MM-dd HH:mm:ss}t %s [%r] [Remote: %a] [Size: %b]"

spring:
  servlet:
    multipart:
      # 앱 레벨 검증(community.image.max-size-bytes)과 이중 방어. 이 한도를 넘기면
      # 앱 코드에 닿기 전에 Spring 이 끊고, CoreExceptionAdvice 가 400 으로 변환한다.
      max-file-size: 5MB
      max-request-size: 6MB

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, email, profile
            redirect-uri: ${OAUTH_REDIRECT_BASE_URL}/login/oauth2/code/google
          riot:
            client-id: ${RIOT_RSO_CLIENT_ID}
            client-secret: ${RIOT_RSO_CLIENT_SECRET}
            scope: openid, cpid
            redirect-uri: ${OAUTH_REDIRECT_BASE_URL}/login/oauth2/code/riot
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub
          riot:
            authorization-uri: https://auth.riotgames.com/authorize
            token-uri: https://auth.riotgames.com/token
            jwk-set-uri: https://auth.riotgames.com/jwks.json
            user-info-uri: https://auth.riotgames.com/userinfo
            user-name-attribute: sub

jwt:
  secret-key: ""
  access-token-expiry: 1800
  refresh-token-expiry: 1209600

app:
  frontend-callback-url: http://localhost:3000/auth/callback

cors:
  allowed-origins: http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:8080,http://lol-ui:3000,https://metapick.me

cookie:
  secure: false
  same-site: Lax

# 로컬도 실제 S3 를 쓴다. 어댑터도 프로파일 분기도 하나이고, 다른 것은 아래 값들뿐이다.
# 격리는 코드가 아니라 버킷이 한다 — 개발자 IAM 정책에 운영 버킷 ARN 자체가 등장하지 않는다.
# key-prefix 는 그 위의 이중 안전장치다(설정 실수로 운영 버킷을 가리켜도 local/ 아래로 떨어진다).
storage:
  s3:
    bucket: ${S3_BUCKET:mmrtr-community-dev}
    region: ${AWS_REGION:ap-northeast-2}
    key-prefix: local
    base-url: ${CDN_BASE_URL:https://dev-cdn.example.com}

community:
  image:
    max-size-bytes: 5242880
    max-count-per-post: 10
    max-pixels: 50000000
    max-width: 1920
    allowed-types: image/jpeg,image/png,image/gif,image/webp
    upload-rate-per-minute: 10
    uploading-retention-hours: 1
    pending-retention-hours: 24
    detached-retention-days: 7
