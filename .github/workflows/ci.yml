name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  checkstyle:
    name: Checkstyle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Checkstyle
        run: ./gradlew checkstyleMain checkstyleTest

  archTest:
    name: Architecture Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Architecture Test
        run: ./gradlew archTest

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # module/app/application 이 lol-db-schema 를 resources srcDir 로 참조한다.
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and Test
        run: ./gradlew build -x checkstyleMain -x checkstyleTest

      # 서브모듈 미체크아웃이나 srcDir 배선 유실은 "조용히" 마이그레이션 0개인 jar 를
      # 만든다 (Flyway 는 No migrations found 로 넘어가고, 빈 DB 에서만 터진다).
      # 부트 jar 에 마이그레이션이 실렸는지 여기서 못 박는다.
      - name: Verify Flyway migrations are packaged
        run: |
          jar=$(ls module/app/application/build/libs/*.jar)
          count=$(unzip -l "$jar" | grep -c 'db/migration/.*\.sql' || true)
          echo "packaged migrations: ${count}"
          if [ "${count}" -eq 0 ]; then
            echo "::error::부트 jar 에 db/migration/*.sql 이 없습니다. lol-db-schema 서브모듈 체크아웃 또는 resources srcDir 배선을 확인하세요."
            exit 1
          fi

      - name: Generate JaCoCo Coverage Report
        run: ./gradlew jacocoTestReport

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/reports/tests/'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: '**/build/reports/jacoco/'

  notify:
    name: Slack Notification
    runs-on: ubuntu-latest
    needs: [checkstyle, archTest, build]
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID }}
            text: "${{ contains(needs.*.result, 'failure') && '❌ CI 실패' || '✅ CI 성공' }}: ${{ github.repository }}"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "${{ contains(needs.*.result, 'failure') && '❌ *CI 실패*' || '✅ *CI 성공*' }}\n*Repo:* ${{ github.repository }}\n*Branch:* ${{ github.head_ref || github.ref_name }}\n*PR:* <${{ github.event.pull_request.html_url || format('{0}/{1}/commit/{2}', github.server_url, github.repository, github.sha) }}|링크>\n*Author:* ${{ github.actor }}\n*Checkstyle:* ${{ needs.checkstyle.result }}\n*Arch:* ${{ needs.archTest.result }}\n*Build:* ${{ needs.build.result }}"
