champion-stats:
  cache:
    enabled: ${CHAMPION_STATS_CACHE_ENABLED:true}

spring:
  jackson:
    time-zone: Asia/Seoul

riot:
  api:
    key: ${RIOT_API_KEY}

management:
  endpoints:
    web:
      exposure:
        include: ${MGMT_EXPOSE_INCLUDE:health,info}
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: ${MGMT_HEALTH_SHOW_DETAILS:never}
  metrics:
    tags:
      application: lol-server

logging:
  level:
    com.example.lolserver.domain.summoner: ${LOG_LEVEL_SUMMONER:DEBUG}
    com.example.lolserver.riot: ${LOG_LEVEL_RIOT:INFO}
    com.example.lolserver.aspect: ${LOG_LEVEL_ASPECT:INFO}
