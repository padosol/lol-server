spring:
  # 운영에서 lol-server 는 스키마를 적용하지 않고 검증만 한다. 적용 주체는
  # lol-repository 다. enabled: true 는 Flyway 를 켜는 것이고, 무엇을 할지는
  # FlywayValidateOnlyConfig 의 전략 빈이 정한다 — migrate() 대신 validate().
  #
  # 배포 순서가 묶인다: 새 마이그레이션이 생기면 lol-repository 가 먼저 적용돼야
  # lol-server 가 뜬다(pending 이면 validate 실패). 자세한 배경은 ADR 0003.
  flyway:
    enabled: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        use_sql_comments: false
        jdbc:
          batch_size: 1000
          order_inserts: true
          order_updates: true
    show-sql: false

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      register-mbeans: true
      maximum-pool-size: 30
      minimum-idle: 30
      connection-timeout: 10000
      max-lifetime: 600000
      validation-timeout: 3000
      pool-name: "lol-server-pool"
