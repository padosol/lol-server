champion-stats:
  cache:
    enabled: true

spring:
  jackson:
    time-zone: Asia/Seoul

riot:
  api:
    key: ""

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
  metrics:
    tags:
      application: lol-server

logging:
  level:
    com.example.lolserver.domain.summoner: DEBUG
    com.example.lolserver.riot: INFO
    com.example.lolserver.aspect: INFO
