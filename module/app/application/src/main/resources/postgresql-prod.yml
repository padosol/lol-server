spring:
  # lol-server 는 app 스키마(member·community·duo)만 소유하고 기동 시 Flyway 로 적용한다
  # (classpath:db/migration/app). app 밖 데이터는 lol-repository API 로 받는다.
  #
  # app 스키마가 없으면 만들고 V1 부터 적용한다. public 에 남은 예전 app 테이블은 옮기지 않고 읽지도 않는다.
  # baseline 하지 않는다 — 이력 없이 테이블만 있는 app 스키마는 V1 을 건너뛰지 않고 실패한다 (docs/db-split/README.md).
  #
  # 접속 계정(DB_USERNAME — 지금은 공유 슈퍼유저)으로 그대로 마이그레이션한다. 전용 계정이나 SET ROLE 에 기대지 않는다.
  flyway:
    enabled: true
    locations: classpath:db/migration/app
    schemas: app
    default-schema: app

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        use_sql_comments: false
        jdbc:
          batch_size: 1000
          order_inserts: true
          order_updates: true
    show-sql: false

  datasource:
    # search_path 를 접속 계정 설정에 기대지 않고 직접 지정한다
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=app
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      register-mbeans: true
      maximum-pool-size: 30
      minimum-idle: 30
      connection-timeout: 10000
      max-lifetime: 600000
      validation-timeout: 3000
      pool-name: "lol-server-pool"
