spring:
  # 스키마 마이그레이션은 lol-repository 가 단독으로 소유한다 (lol-db-schema 서브모듈을
  # 이미지에 싣고 기동 시 Flyway 로 적용). lol-server 는 스키마를 만들지 않고
  # ddl-auto: validate 로 검증만 한다.
  flyway:
    enabled: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # 테이블이 app·riot 스키마로 나뉘어도 search_path(app, riot, public) 전체에서 찾도록 테이블 단위로 조회.
        # 기본값(grouped)은 현재 스키마(app) 하나만 봐서 riot 테이블을 못 찾고 validate 가 실패한다.
        hbm2ddl:
          jdbc_metadata_extraction_strategy: individually
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        use_sql_comments: false
        jdbc:
          batch_size: 1000
          order_inserts: true
          order_updates: true
    show-sql: false

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      register-mbeans: true
      maximum-pool-size: 30
      minimum-idle: 30
      connection-timeout: 10000
      max-lifetime: 600000
      validation-timeout: 3000
      pool-name: "lol-server-pool"
