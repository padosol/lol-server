spring:
  # lol-server 는 app 스키마(member·community·duo)만 소유하고 기동 시 Flyway 로 적용한다
  # (classpath:db/migration/app). app 밖 데이터는 lol-repository API 로 받는다.
  #
  # app 스키마가 없으면 만들고 V1 부터 적용한다 (prod 와 같다). 예전 공유 체인(lol-db-schema)이 public 에 만든
  # app 테이블(member·community_*·duo_*)은 쓰이지 않는 사본으로 남는다 — 접속 URL 이 currentSchema=app 이다.
  flyway:
    enabled: true
    locations: classpath:db/migration/app
    schemas: app
    default-schema: app

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        use_sql_comments: true
        jdbc:
          batch_size: 1000
          order_inserts: true
          order_updates: true
    show-sql: false

  datasource:
    # search_path 를 접속 계정 설정에 기대지 않고 직접 지정한다
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?currentSchema=app
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
    hikari:
      register-mbeans: true
      maximum-pool-size: 30
      minimum-idle: 30
      connection-timeout: 10000
      max-lifetime: 600000
      validation-timeout: 3000
      pool-name: "lol-server-pool"
