name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # 마이그레이션 SQL(lol-db-schema). Dockerfile 이 COPY 하므로 이 잡에는 필요하다.
      # private 이라 PAT 가 필요한데, 메인 체크아웃은 기본 GITHUB_TOKEN 으로 두고
      # 서브모듈만 PAT 로 받는다. 배경은 ADR 0003.
      - name: Checkout lol-db-schema
        env:
          PAT: ${{ secrets.SUBMODULE_PAT }}
        run: |
          # 시크릿 값에 개행이 섞여 있으면 git config 키가 깨진다 — 실제로 그렇게 실패했다.
          PAT=$(printf '%s' "$PAT" | tr -d '\r\n')
          git config --global url."https://x-access-token:$PAT@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive
          git config --global --unset-all url."https://x-access-token:$PAT@github.com/".insteadOf

      - name: Extract version and SHA
        id: version
        run: |
          VERSION=$(grep "version = '" build.gradle | head -1 | awk -F"'" '{print $2}')
          SHA_SHORT=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ steps.version.outputs.version }}-${{ steps.version.outputs.sha_short }}
            ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trigger-cd:
    name: Trigger CD Deployment
    runs-on: ubuntu-latest
    needs: [deploy]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Extract version and SHA
        id: version
        run: |
          VERSION=$(grep "version = '" build.gradle | head -1 | awk -F"'" '{print $2}')
          SHA_SHORT=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Trigger CD deployment
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.CD_REPO_TOKEN }}
          repository: ${{ vars.CD_REPO }}
          event-type: deploy
          client-payload: >-
            {
              "image": "${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}",
              "version": "${{ steps.version.outputs.version }}",
              "sha": "${{ github.event.workflow_run.head_sha }}",
              "sha_short": "${{ steps.version.outputs.sha_short }}",
              "tag": "${{ steps.version.outputs.version }}-${{ steps.version.outputs.sha_short }}"
            }

  notify:
    name: Slack Notification
    runs-on: ubuntu-latest
    needs: [deploy, trigger-cd]
    if: always()
    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID }}
            text: "${{ needs.deploy.result == 'success' && '🚀 배포 성공' || '❌ 배포 실패' }}: ${{ github.repository }}"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "${{ needs.deploy.result == 'success' && '🚀 *배포 성공*' || '❌ *배포 실패*' }}\n*Repo:* ${{ github.repository }}\n*Branch:* ${{ github.event.workflow_run.head_branch }}\n*Commit:* <${{ format('{0}/{1}/commit/{2}', github.server_url, github.repository, github.event.workflow_run.head_sha) }}|${{ github.event.workflow_run.head_sha }}>\n*Deploy:* ${{ needs.deploy.result }}"
