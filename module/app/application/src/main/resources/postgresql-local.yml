spring:
  # lol-server 는 app 스키마(member·community·duo)만 소유하고 기동 시 Flyway 로 적용한다
  # (classpath:db/migration/app). app 밖 데이터는 lol-repository API 로 받는다.
  #
  # local: app 스키마가 없으면 만들고 V1 부터 적용한다. lol-repository 가 공유 체인으로 public 에 만든
  # app 테이블(member·community_*·duo_*)은 쓰이지 않는 사본으로 남는다 — search_path 상 app 이 먼저다.
  # (prod 의 "public 에 app 테이블이 있으면 거부" 가드는 local 에 넣지 않는다 → docs/db-split/README.md 6절)
  flyway:
    enabled: true
    locations: classpath:db/migration/app
    schemas: app
    default-schema: app
    # 스키마 이동으로 테이블은 있는데 이력이 없는 app 스키마 → V1 을 baseline 으로 기록하고 V2 부터 적용
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        use_sql_comments: true
        jdbc:
          batch_size: 1000
          order_inserts: true
          order_updates: true
    show-sql: false

  datasource:
    # search_path 를 접속 계정 설정에 기대지 않고 직접 지정한다
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?currentSchema=app
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
    hikari:
      register-mbeans: true
      maximum-pool-size: 30
      minimum-idle: 30
      connection-timeout: 10000
      max-lifetime: 600000
      validation-timeout: 3000
      pool-name: "lol-server-pool"
