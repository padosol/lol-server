champion-stats:
  cache:
    enabled: true

spring:
  jackson:
    time-zone: Asia/Seoul

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: never
  metrics:
    tags:
      application: lol-server

logging:
  level:
    com.example.lolserver.aspect: WARN
