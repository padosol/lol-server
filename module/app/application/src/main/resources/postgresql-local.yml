spring:
  # 스키마 마이그레이션은 lol-repository 와 lol-server 가 함께 적용한다. 둘 다 같은
  # lol-db-schema 서브모듈을 싣고 기동 시 Flyway 를 돌린다.
  #
  # local: 이제 빈 DB 에서 lol-server 만 띄워도 스키마가 만들어진다. 예전에는
  # lol-repository 를 먼저 띄우지 않으면 ddl-auto: validate 가 실패했다.
  flyway:
    enabled: true

  # local 개발용 기본 데이터 시드 (스키마는 Flyway 담당, 여기선 데이터만).
  # Flyway 마이그레이션 이후 실행되며, 스크립트는 ON CONFLICT 로 멱등 처리됨.
  sql:
    init:
      mode: always
      data-locations: classpath:db/seed/season-local.sql

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        use_sql_comments: true
        jdbc:
          batch_size: 1000
          order_inserts: true
          order_updates: true
    show-sql: false

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
    hikari:
      register-mbeans: true
      maximum-pool-size: 30
      minimum-idle: 30
      connection-timeout: 10000
      max-lifetime: 600000
      validation-timeout: 3000
      pool-name: "lol-server-pool"
