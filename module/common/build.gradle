plugins {
    id 'lolserver.web-conventions'
    id 'lolserver.persistence-conventions'
    id 'java-test-fixtures'
}

dependencies {
    // 공유 인프라 config(RedisConfig/RedissonConfig)용. 컨텍스트로 전이되지 않도록 implementation.
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.redisson:redisson-spring-boot-starter:3.46.0'
    // RestClientConfig(외부 API 클라이언트 베이스)의 JavaTimeModule 직렬화용
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // 공유 인프라 config(S3Config)용. RedisConfig 와 같은 자리다 — 기술 빈 생성만 여기 있고
    // "이미지의 생명주기"라는 비즈니스 규칙은 community 컨텍스트가 갖는다.
    implementation platform('software.amazon.awssdk:bom:2.28.16')
    implementation 'software.amazon.awssdk:s3'

    // testFixtures: 공유 테스트 베이스(RepositoryTestBase, TestJpaConfig, RestDocsSupport)가 사용한다.
    // 각 컨텍스트 모듈은 testImplementation(testFixtures(project(':module:common'))) 로 끌어온다.
    testFixturesImplementation 'org.springframework.boot:spring-boot-starter-test'
    testFixturesImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    testFixturesImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
    testFixturesImplementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    testFixturesImplementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
}
