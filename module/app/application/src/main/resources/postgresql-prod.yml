spring:
  # lol-server 는 app 스키마(member·community·duo)만 소유하고 기동 시 Flyway 로 적용한다
  # (classpath:db/migration/app). app 밖 데이터는 lol-repository API 로 받는다.
  #
  # 이 설정은 스키마 이동(docs/db-split/02-move-schema.sql) 뒤에만 기동된다:
  # - 이동 전(app 스키마 없음): create-schemas=false 라 Flyway 가 실패한다
  # - app 테이블이 public 에 남아 있으면 db/migration-guard/beforeMigrate.sql 이 실패시킨다
  # 둘 다 빈 테이블이 실제 데이터를 가리는 사고를 막기 위한 의도된 실패다.
  flyway:
    enabled: true
    locations: classpath:db/migration/app,classpath:db/migration-guard
    schemas: app
    default-schema: app
    create-schemas: false
    # 이동 직후 app 스키마는 테이블은 있고 이력이 없다 → V1 을 baseline 으로 기록하고 V2 부터 적용
    baseline-on-migrate: true
    baseline-version: 1
    # 접속 계정과 무관하게 Flyway 가 만드는 객체(이력·새 테이블)를 lol_server 소유로 둔다.
    # lol_server 계정으로 전환하기 전(지금 계정으로 접속)에도 소유자가 어긋나지 않게 — docs/db-split/README.md 5절
    init-sqls: SET ROLE lol_server
    # SET ROLE 이 앱 커넥션 풀에 남으면 앱 요청도 lol_server 권한으로 돈다(계정 전환 전 과도기의 의도와 다름).
    # user 를 지정하면 Spring Boot 가 Flyway 전용 커넥션(풀 없음)을 따로 만든다.
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        use_sql_comments: false
        jdbc:
          batch_size: 1000
          order_inserts: true
          order_updates: true
    show-sql: false

  datasource:
    # search_path 를 접속 계정 설정에 기대지 않고 직접 지정한다
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=app
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      register-mbeans: true
      maximum-pool-size: 30
      minimum-idle: 30
      connection-timeout: 10000
      max-lifetime: 600000
      validation-timeout: 3000
      pool-name: "lol-server-pool"
