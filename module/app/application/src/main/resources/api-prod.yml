server:
  port: 8085
  tomcat:
    basedir: .
    accesslog:
      enabled: true
      directory: /dev
      prefix: stdout
      suffix: ""
      file-date-format: ""
      pattern: "%{yyyy-MM-dd HH:mm:ss}t %s [%r] [Remote: %a] [Size: %b]"

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, email, profile
            redirect-uri: ${OAUTH_REDIRECT_BASE_URL}/login/oauth2/code/google
          riot:
            client-id: ${RIOT_RSO_CLIENT_ID}
            client-secret: ${RIOT_RSO_CLIENT_SECRET}
            scope: openid, cpid
            redirect-uri: ${OAUTH_REDIRECT_BASE_URL}/login/oauth2/code/riot
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub
          riot:
            authorization-uri: https://auth.riotgames.com/authorize
            token-uri: https://auth.riotgames.com/token
            jwk-set-uri: https://auth.riotgames.com/jwks.json
            user-info-uri: https://auth.riotgames.com/userinfo
            user-name-attribute: sub

jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-token-expiry: 1800
  refresh-token-expiry: 1209600

app:
  frontend-callback-url: ${APP_FRONTEND_CALLBACK_URL}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

cookie:
  secure: true
  same-site: None

# 기본값(`:`)을 두지 않는 것은 기존 운영 설정의 관례와 같다 — 값이 빠지면 조용히 잘못된
# 버킷을 쓰는 대신 부팅이 실패해야 한다. 크리덴셜은 ECS Task Role 이 제공하므로 키가 없다.
storage:
  s3:
    bucket: ${S3_BUCKET}
    region: ${AWS_REGION}
    key-prefix: prod
    base-url: ${CDN_BASE_URL}

community:
  image:
    max-size-bytes: 5242880
    max-count-per-post: 10
    max-pixels: 50000000
    max-width: 1920
    allowed-types: image/jpeg,image/png,image/gif,image/webp
    upload-rate-per-minute: 10
    uploading-retention-hours: 1
    pending-retention-hours: 24
    detached-retention-days: 7
