plugins {
    id 'lolserver.web-conventions'
    id 'lolserver.persistence-conventions'
}

dependencies {
    implementation project(':module:common')

    // 상위 컨텍스트: member 의 published port.in(UseCase) + application.model(ReadModel)만 사용한다.
    // 경계는 ArchitectureTest 가 강제한다(member.domain/adapter/port.out 의존 금지).
    implementation project(':module:domain:member')

    // 컨트롤러의 @AuthenticationPrincipal 어노테이션 사용을 위한 최소 의존.
    implementation 'org.springframework.security:spring-security-core'

    // 이미지 업로드. implementation 은 모듈간 전이되지 않으므로 common 에 선언돼 있어도
    // 여기서 다시 선언해야 한다(match/championstats 의 redis 선언과 같은 패턴).
    implementation platform('software.amazon.awssdk:bom:2.28.16')
    implementation 'software.amazon.awssdk:s3'                  // S3ImageStorageAdapter
    implementation 'org.apache.tika:tika-core:2.9.2'            // 매직바이트 기반 실제 타입 판별
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'  // 업로드 rate limit

    testImplementation(testFixtures(project(':module:common')))
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
}
