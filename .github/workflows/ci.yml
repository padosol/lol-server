name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  checkstyle:
    name: Checkstyle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # 마이그레이션 SQL(lol-db-schema). 없으면 processResources 가드가 빌드를 세운다.
      # private 이라 자격증명이 필요한데, 메인 체크아웃은 기본 GITHUB_TOKEN 으로 두고
      # 서브모듈만 PAT 로 받는다 — PAT 에 이 리포 권한이 없어도 되고, PAT 가 죽어도
      # 메인 체크아웃은 살아 실패 지점이 분명해진다. 배경은 ADR 0003.
      - name: Checkout lol-db-schema
        env:
          PAT: ${{ secrets.SUBMODULE_PAT }}
        run: |
          # 시크릿 값에 개행이 섞여 있으면 git config 키가 깨진다 — 실제로 그렇게 실패했다.
          PAT=$(printf '%s' "$PAT" | tr -d '\r\n')
          git config --global url."https://x-access-token:$PAT@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive
          git config --global --unset-all url."https://x-access-token:$PAT@github.com/".insteadOf

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Checkstyle
        run: ./gradlew checkstyleMain checkstyleTest

  archTest:
    name: Architecture Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # 마이그레이션 SQL(lol-db-schema). 없으면 processResources 가드가 빌드를 세운다.
      # private 이라 자격증명이 필요한데, 메인 체크아웃은 기본 GITHUB_TOKEN 으로 두고
      # 서브모듈만 PAT 로 받는다 — PAT 에 이 리포 권한이 없어도 되고, PAT 가 죽어도
      # 메인 체크아웃은 살아 실패 지점이 분명해진다. 배경은 ADR 0003.
      - name: Checkout lol-db-schema
        env:
          PAT: ${{ secrets.SUBMODULE_PAT }}
        run: |
          # 시크릿 값에 개행이 섞여 있으면 git config 키가 깨진다 — 실제로 그렇게 실패했다.
          PAT=$(printf '%s' "$PAT" | tr -d '\r\n')
          git config --global url."https://x-access-token:$PAT@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive
          git config --global --unset-all url."https://x-access-token:$PAT@github.com/".insteadOf

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Architecture Test
        run: ./gradlew archTest

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # 마이그레이션 SQL(lol-db-schema). 없으면 processResources 가드가 빌드를 세운다.
      # private 이라 자격증명이 필요한데, 메인 체크아웃은 기본 GITHUB_TOKEN 으로 두고
      # 서브모듈만 PAT 로 받는다 — PAT 에 이 리포 권한이 없어도 되고, PAT 가 죽어도
      # 메인 체크아웃은 살아 실패 지점이 분명해진다. 배경은 ADR 0003.
      - name: Checkout lol-db-schema
        env:
          PAT: ${{ secrets.SUBMODULE_PAT }}
        run: |
          # 시크릿 값에 개행이 섞여 있으면 git config 키가 깨진다 — 실제로 그렇게 실패했다.
          PAT=$(printf '%s' "$PAT" | tr -d '\r\n')
          git config --global url."https://x-access-token:$PAT@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive
          git config --global --unset-all url."https://x-access-token:$PAT@github.com/".insteadOf

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and Test
        run: ./gradlew build -x checkstyleMain -x checkstyleTest

      - name: Generate JaCoCo Coverage Report
        run: ./gradlew jacocoTestReport

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/reports/tests/'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: '**/build/reports/jacoco/'

  notify:
    name: Slack Notification
    runs-on: ubuntu-latest
    needs: [checkstyle, archTest, build]
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID }}
            text: "${{ contains(needs.*.result, 'failure') && '❌ CI 실패' || '✅ CI 성공' }}: ${{ github.repository }}"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "${{ contains(needs.*.result, 'failure') && '❌ *CI 실패*' || '✅ *CI 성공*' }}\n*Repo:* ${{ github.repository }}\n*Branch:* ${{ github.head_ref || github.ref_name }}\n*PR:* <${{ github.event.pull_request.html_url || format('{0}/{1}/commit/{2}', github.server_url, github.repository, github.sha) }}|링크>\n*Author:* ${{ github.actor }}\n*Checkstyle:* ${{ needs.checkstyle.result }}\n*Arch:* ${{ needs.archTest.result }}\n*Build:* ${{ needs.build.result }}"
