spring:
  # 스키마 마이그레이션은 lol-repository 와 lol-server 가 함께 적용한다. 둘 다 같은
  # lol-db-schema 서브모듈을 싣고 기동 시 Flyway 를 돌린다 — 같은 파일이니 체크섬도 같고,
  # 동시에 떠도 Flyway 가 히스토리 테이블에 락을 잡아 한쪽이 기다린다.
  #
  # 전제: 두 리포의 서브모듈 포인터가 같은 계보(main)를 가리킨다. 서로 다른 브랜치에서
  # 같은 번호(V37)를 각자 쓰면 먼저 적용한 쪽이 이기고 나머지가 체크섬 불일치로 죽는다.
  # lol-db-schema/README.md 의 번호 가드를 지킬 것.
  flyway:
    enabled: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        use_sql_comments: false
        jdbc:
          batch_size: 1000
          order_inserts: true
          order_updates: true
    show-sql: false

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      register-mbeans: true
      maximum-pool-size: 30
      minimum-idle: 30
      connection-timeout: 10000
      max-lifetime: 600000
      validation-timeout: 3000
      pool-name: "lol-server-pool"
