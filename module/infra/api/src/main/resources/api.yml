server:
  port: ${SERVER_PORT:8085}
  tomcat:
    basedir: .
    accesslog:
      enabled: true
      pattern: "%{yyyy-MM-dd HH:mm:ss}t %s [%r] [Remote: %a] [Size: %b]"

spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, email, profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          riot:
            client-id: ${RIOT_RSO_CLIENT_ID}
            client-secret: ${RIOT_RSO_CLIENT_SECRET}
            scope: openid, cpid
            redirect-uri: ${OAUTH_REDIRECT_BASE_URL:http://local.metapick.me}/login/oauth2/code/riot
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub
          riot:
            authorization-uri: https://auth.riotgames.com/authorize
            token-uri: https://auth.riotgames.com/token
            jwk-set-uri: https://auth.riotgames.com/jwks.json
            user-info-uri: https://auth.riotgames.com/userinfo
            user-name-attribute: sub

jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-token-expiry: ${JWT_ACCESS_TOKEN_EXPIRY:1800}
  refresh-token-expiry: ${JWT_REFRESH_TOKEN_EXPIRY:1209600}

app:
  frontend-callback-url: ${APP_FRONTEND_CALLBACK_URL:http://localhost:3000/auth/callback}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:8080,http://lol-ui:3000,https://metapick.me}

cookie:
  secure: ${COOKIE_SECURE:true}
  same-site: ${COOKIE_SAME_SITE:None}
