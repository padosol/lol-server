plugins {
    id 'lolserver.web-conventions'
    id 'lolserver.persistence-conventions'
}

dependencies {
    implementation project(':module:common')
    implementation project(':module:shared')

    // 상위 컨텍스트: published port.in(UseCase) + application.model(ReadModel)만 사용한다.
    // 경계는 ArchitectureTest 가 강제한다(각 컨텍스트의 domain/adapter/port.out 의존 금지).
    implementation project(':module:domain:member')
    implementation project(':module:domain:summoner')
    implementation project(':module:domain:match')

    // 컨트롤러의 @AuthenticationPrincipal 어노테이션 사용을 위한 최소 의존.
    implementation 'org.springframework.security:spring-security-core'

    // 듀오 실시간 알림 Redis pub/sub fanout (발행 + 구독 어댑터)
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // 선착순 확정/활성글 1개 제한의 분산 락 (ADR 0002, DuoLockAdapter)
    implementation 'org.redisson:redisson-spring-boot-starter:3.46.0'

    testImplementation(testFixtures(project(':module:common')))
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
}
